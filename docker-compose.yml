services:
  ocr-sort:
    build: .
    image: ocr-layout-sort:latest
    container_name: ocr-layout-sort
    ports:
      - "8000:8000"
    volumes:
      - ocr-data:/data
    environment:
      OCR_DB_PATH: /data/ocr_sort.db
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2).status==200 else 1)"
      interval: 15s
      timeout: 3s
      start_period: 5s
      retries: 3
    restart: unless-stopped

volumes:
  ocr-data:
